name: Build Lia AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # V15: the offline LLM needs the llama.cpp C++ sources. They are
      # NOT vendored in this repo (thousands of files); CI clones them
      # once, at the same pinned commit as the vendored llama-lib binding
      # (see llama-lib/NOTICE.md). Shallow clone of one commit only.
      - name: Clone llama.cpp sources (offline engine)
        run: |
          git init llama.cpp
          cd llama.cpp
          git remote add origin https://github.com/ggerganov/llama.cpp.git
          git fetch --depth 1 origin e300919cc704ddde3a8a8346a8714f57eeeee71b
          git checkout FETCH_HEAD
          git rev-parse HEAD

      # V15 fix: the first V15 build failed with LicenceNotAcceptedException
      # — AGP tried to auto-install NDK 29.0.13113456 (pinned in
      # llama-lib/build.gradle.kts) but its licence was not accepted.
      # Accept all SDK licences, then install that exact NDK up front.
      - name: Accept SDK licences and install NDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456"

      - name: Build directDebug APK
        run: ./gradlew assembleDirectDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lia-ai-direct-debug-apk
          path: app/build/outputs/apk/direct/debug/*.apk
