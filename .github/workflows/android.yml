name: Build Lia AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # V18 diet: the offline LLM (llama.cpp clone + NDK/CMake) and
      # the sherpa-onnx download steps were removed with the engines
      # they served. Nothing here needs the NDK or CMake any more.
      - name: Build directDebug APK
        run: ./gradlew assembleDirectDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lia-ai-direct-debug-apk
          path: app/build/outputs/apk/direct/debug/*.apk
