name: Build Gold AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Release signing secrets (optional — the build still succeeds
    # unsigned without them; see play-store/SIGNING.md).
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # V19: the on-device voice engine (sherpa-onnx 2.0.3, Apache-2.0)
      # is back for Pocket TTS only (restored from V17). It is NOT on
      # Maven Central. CI downloads the release tarball + JVM jar from
      # GitHub releases (pinned, SHA-256 checked), extracts the
      # arm64-v8a + x86_64 native libs into app/src/main/jniLibs and the
      # jar into app/libs (see app/build.gradle.kts). The V18
      # arm64-only filter ships just arm64, so only ~31.5 MB of .so
      # lands in the APK. Other ABIs degrade gracefully at runtime
      # (SherpaRuntime.isAvailable() == false). No NDK/CMake needed —
      # the llama.cpp steps stay out (offline AI is still gone).
      - name: Download sherpa-onnx (on-device voice engine)
        run: |
          set -euo pipefail
          SHERPA_VERSION=2.0.3
          TARBALL_SHA256=2a30b222abae6d5cf544df4a1c27944279449c25dbb9c755097189cb45db1df0
          JAR_SHA256=ad69b6a54462ba3671782617b11d35975c8d6b7c84ae11765e3a06dd0c56c0e5
          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          curl -sSL -o /tmp/sherpa-onnx.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-v${SHERPA_VERSION}-android.tar.bz2"
          echo "${TARBALL_SHA256}  /tmp/sherpa-onnx.tar.bz2" | sha256sum -c -
          curl -sSL -o app/libs/sherpa-onnx-jvm-2.0.3.jar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-jvm-2.0.3.jar"
          echo "${JAR_SHA256}  app/libs/sherpa-onnx-jvm-2.0.3.jar" | sha256sum -c -
          mkdir -p /tmp/sherpa-onnx
          tar -xjf /tmp/sherpa-onnx.tar.bz2 -C /tmp/sherpa-onnx
          cp /tmp/sherpa-onnx/jniLibs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          cp /tmp/sherpa-onnx/jniLibs/x86_64/*.so app/src/main/jniLibs/x86_64/
          ls -la app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64 app/libs

      - name: Build directDebug APK
        run: ./gradlew assembleDirectDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gold-ai-direct-debug-apk
          path: app/build/outputs/apk/direct/debug/*.apk

      # Gold AI store releases: play flavor, signed if the keystore
      # secrets exist (see play-store/SIGNING.md), unsigned otherwise.
      # AAB -> Google Play + Huawei AppGallery.
      # APK -> Amazon Appstore + Samsung Galaxy Store + Aptoide
      # (Aptoide takes APK only, never AAB).
      - name: Set up release signing (if keystore secret exists)
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Build playRelease AAB + APK
        run: |
          ./gradlew bundlePlayRelease --stacktrace
          ./gradlew assemblePlayRelease --stacktrace

      - name: Upload playRelease AAB (Google Play + Huawei)
        uses: actions/upload-artifact@v4
        with:
          name: gold-ai-play-release-aab
          path: app/build/outputs/bundle/playRelease/*.aab

      - name: Upload playRelease APK (Amazon + Samsung + Aptoide)
        uses: actions/upload-artifact@v4
        with:
          name: gold-ai-play-release-apk
          path: app/build/outputs/apk/play/release/*.apk

      # Public download links for the store files: Aptoide's form takes
      # a direct .apk URL (it cannot accept a zipped Actions artifact),
      # and commit_ will need the .aab link. Creates/updates the
      # gold-ai-v1.0.0 release with both files attached.
      - name: Publish GitHub Release (AAB + APK)
        if: github.ref == 'refs/heads/v21-fix-wakeword'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gold-ai-v1.0.0
          name: Gold AI v1.0.0
          body: |
            Gold AI v1.0.0 — free AI voice companion (English).
            - AAB: Google Play / Huawei AppGallery / commit_
            - APK: Amazon Appstore / Samsung Galaxy Store / Aptoide
          files: |
            app/build/outputs/bundle/playRelease/*.aab
            app/build/outputs/apk/play/release/*.apk
          draft: false
          prerelease: false
